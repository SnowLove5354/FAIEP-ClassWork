<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="日历展示平台：大日历视图、商务日程与主题日历同屏展示，实时时钟与星期主题切换">
<meta name="theme-color" content="#0f2027">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
<title>日历展示平台</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;background:var(--page-bg,#f0f2f5);color:#333;}

:root{
  --topbar-bg:linear-gradient(90deg,#0f2027,#203a43,#2c5364);
  --page-bg:#f0f2f5;
  --cal-a-color:#3b82f6;
  --cal-b-color:#e11d48;
  --card-radius:16px;
}

/* ============ 入场加载动画 ============ */
#loader{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#1e3c72 0%,#2a5298 50%,#7e57c2 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s ease;background-size:cover;background-position:center;}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none;}
#loaderContent{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;}

/* 旋转环（默认） */
.loader-ring{width:80px;height:80px;position:relative;margin-bottom:28px;}
.loader-ring::before,.loader-ring::after{content:'';position:absolute;inset:0;border-radius:50%;border:4px solid rgba(255,255,255,.15);}
.loader-ring::after{border-top-color:#fff;border-right-color:#fff;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 脉冲圆点 */
.loader-dots{display:flex;gap:12px;margin-bottom:28px;}
.loader-dots span{width:16px;height:16px;border-radius:50%;background:#fff;animation:dotsBounce 1.2s ease-in-out infinite;}
.loader-dots span:nth-child(2){animation-delay:.15s;}
.loader-dots span:nth-child(3){animation-delay:.3s;}
@keyframes dotsBounce{0%,80%,100%{transform:scale(.6);opacity:.5;}40%{transform:scale(1);opacity:1;}}

/* 波浪文字 */
.loader-wave{font-size:36px;font-weight:300;letter-spacing:8px;color:#fff;margin-bottom:20px;display:flex;gap:4px;}
.loader-wave span{display:inline-block;animation:waveAnim 1.4s ease-in-out infinite;}
.loader-wave span:nth-child(1){animation-delay:0s;}
.loader-wave span:nth-child(2){animation-delay:.1s;}
.loader-wave span:nth-child(3){animation-delay:.2s;}
.loader-wave span:nth-child(4){animation-delay:.3s;}
.loader-wave span:nth-child(5){animation-delay:.4s;}
.loader-wave span:nth-child(6){animation-delay:.5s;}
.loader-wave span:nth-child(7){animation-delay:.6s;}
.loader-wave span:nth-child(8){animation-delay:.7s;}
.loader-wave span:nth-child(9){animation-delay:.8s;}
.loader-wave span:nth-child(10){animation-delay:.9s;}
.loader-wave span:nth-child(11){animation-delay:1s;}
.loader-wave span:nth-child(12){animation-delay:1.1s;}
@keyframes waveAnim{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}

/* 进度条 */
.loader-bar{width:220px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;margin-bottom:28px;}
.loader-bar span{display:block;height:100%;background:#fff;width:40%;border-radius:2px;animation:barAnim 1.4s ease-in-out infinite;}
@keyframes barAnim{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}

/* 圆环脉冲 */
.loader-pulse{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.15);position:relative;margin-bottom:28px;}
.loader-pulse::before,.loader-pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.55);animation:pulseAnim 1.6s ease-out infinite;}
.loader-pulse::after{animation-delay:.6s;}
@keyframes pulseAnim{0%{transform:scale(.6);opacity:1;}100%{transform:scale(1.8);opacity:0;}}

/* 通用文字 */
.loader-text{color:#fff;font-size:18px;letter-spacing:4px;font-weight:300;margin-bottom:10px;animation:textPulse 1.6s ease-in-out infinite;}
@keyframes textPulse{0%,100%{opacity:.55}50%{opacity:1}}
.loader-subtext{color:rgba(255,255,255,.65);font-size:13px;letter-spacing:2px;}

/* ============ 顶栏 ============ */
.topbar{background:var(--topbar-bg);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.15);position:relative;z-index:10;transition:background .4s ease;}
.topbar .brand{font-size:18px;font-weight:600;letter-spacing:2px;display:flex;align-items:center;gap:10px;}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:blink 1.8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.topbar .realtime{text-align:center;flex:1;}
.topbar .realtime .date-str{font-size:14px;opacity:.85;letter-spacing:1px;}
.topbar .realtime .time-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:2px;flex-wrap:wrap;}
.topbar .realtime .time-str{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:2px;}
.topbar .realtime .term-badge{font-size:12px;font-weight:600;letter-spacing:1px;padding:5px 13px;border-radius:20px;white-space:nowrap;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;transition:all .3s ease;}
.topbar .realtime .term-badge.in{background:linear-gradient(90deg,#4ade80,#22d3ee);color:#053225;border-color:transparent;box-shadow:0 0 14px rgba(74,222,128,.45);}
.topbar .realtime .term-badge.off{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.18);}
.topbar .realtime .week-str{font-size:13px;opacity:.7;letter-spacing:2px;margin-top:2px;}
.topbar-spacer{width:180px;flex:0 0 180px;}
.sync-tip{position:fixed;top:70px;right:16px;padding:6px 12px;border-radius:16px;font-size:11px;font-weight:600;z-index:50;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px);opacity:.85;}
.sync-tip.cloud{background:rgba(22,163,74,.85);}
.sync-tip.local{background:rgba(234,88,12,.85);}

/* ============ 大日历 ============ */
.big-calendar{background:#fff;margin:14px auto 0;padding:14px 18px;border-radius:var(--card-radius);box-shadow:0 4px 16px rgba(0,0,0,.06);max-width:1600px;transition:border-radius .3s ease;}
.big-cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.big-cal-title{font-size:16px;font-weight:700;color:#1e293b;display:flex;align-items:center;gap:8px;}
.big-cal-title .tag{font-size:11px;background:linear-gradient(90deg,var(--cal-a-color),#8b5cf6);color:#fff;padding:2px 10px;border-radius:10px;font-weight:500;letter-spacing:1px;}
.big-cal-nav{display:flex;gap:4px;}
.big-cal-nav button{background:#f1f5f9;border:none;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;color:#475569;transition:.2s;font-weight:600;}
.big-cal-nav button.today-btn{width:auto;padding:0 12px;font-size:12px;}
.big-cal-nav button:hover{background:var(--cal-a-color);color:#fff;}
.big-cal-month{font-size:14px;color:#475569;font-weight:500;}

.big-weekdays,.big-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.big-weekdays{margin-bottom:4px;}
.big-weekdays div{text-align:center;font-size:11px;color:#94a3b8;font-weight:600;padding:4px 0;letter-spacing:1px;}
.big-weekdays div.wk{color:#ef4444;}
.big-weekdays div.we{color:var(--cal-a-color);}
.big-days .day{aspect-ratio:3/1;display:flex;flex-direction:column;padding:3px 6px;border-radius:7px;cursor:pointer;position:relative;transition:all .25s cubic-bezier(.4,0,.2,1);border:2px solid transparent;background:#fafbfc;}
.big-days .day:hover{background:color-mix(in srgb,var(--cal-a-color) 8%,white);transform:translateY(-1px);box-shadow:0 4px 10px color-mix(in srgb,var(--cal-a-color) 15%,transparent);}
.big-days .day.other-month{opacity:.3;background:transparent;}
.big-days .day.today{background:linear-gradient(135deg,var(--cal-a-color),#6366f1);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--cal-a-color) 35%,transparent);}
.big-days .day.today .dnum{color:#fff;font-weight:700;}
.big-days .day.today .dwk{color:rgba(255,255,255,.8);}
.big-days .day.today .dbar .b-a{background:#fff;}
.big-days .day.today .dbar .b-b{background:rgba(255,255,255,.7);}
.big-days .day.selected{border-color:var(--cal-a-color);background:color-mix(in srgb,var(--cal-a-color) 8%,white);transform:translateY(-1px);box-shadow:0 4px 10px color-mix(in srgb,var(--cal-a-color) 18%,transparent);}
.big-days .day .dnum{font-size:13px;font-weight:600;line-height:1;}
.big-days .day .dwk{font-size:8px;color:#94a3b8;margin-top:1px;letter-spacing:1px;}
.big-days .day .dbar{position:absolute;bottom:3px;left:6px;right:6px;display:flex;gap:2px;}
.big-days .day .dbar .b-a{width:100%;height:2px;border-radius:1px;background:var(--cal-a-color);}
.big-days .day .dbar .b-b{width:100%;height:2px;border-radius:1px;background:var(--cal-b-color);}
.big-days .day .dbar .b-none{flex:1;}
.big-days .day .cnt-a,.big-days .day .cnt-b{position:absolute;top:2px;right:4px;font-size:9px;font-weight:700;padding:0 4px;border-radius:6px;color:#fff;line-height:14px;}
.big-days .day .cnt-a{background:var(--cal-a-color);}
.big-days .day .cnt-b{background:var(--cal-b-color);top:2px;right:20px;}
.big-days .day.today .cnt-a,.big-days .day.today .cnt-b{background:#fff;color:var(--cal-a-color);}

/* ============ 双栏 ============ */
.dual-panel{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px;max-width:1600px;margin:0 auto;transition:grid-template-columns .3s ease;}

/* 日历A */
.calendar-a{background:#fff;border-radius:var(--card-radius);box-shadow:0 4px 20px rgba(0,0,0,.06);padding:24px;display:flex;flex-direction:column;transition:border-radius .3s ease;}
.cal-a-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-a-title{font-size:18px;font-weight:700;color:#1e293b;display:flex;align-items:center;gap:10px;}
.cal-a-title .tag{font-size:12px;background:var(--cal-a-color);color:#fff;padding:3px 10px;border-radius:12px;font-weight:500;}
.cal-a-date{font-size:15px;color:#64748b;font-weight:500;}
.cal-a-date .big-day{font-size:32px;font-weight:800;color:var(--cal-a-color);margin-right:8px;line-height:1;}
.cal-a-events{flex:1;overflow-y:auto;max-height:520px;}
.cal-a-summary{background:linear-gradient(135deg,color-mix(in srgb,var(--cal-a-color) 12%,white),color-mix(in srgb,var(--cal-a-color) 22%,white));padding:14px 16px;border-radius:calc(var(--card-radius) - 4px);margin-bottom:14px;display:flex;align-items:center;gap:12px;transition:border-radius .3s ease;}
.cal-a-summary .icon{font-size:28px;}
.cal-a-summary .info{flex:1;}
.cal-a-summary .info .label{font-size:12px;color:#64748b;}
.cal-a-summary .info .count{font-size:22px;font-weight:700;color:var(--cal-a-color);}
.cal-a-event-item{background:linear-gradient(90deg,color-mix(in srgb,var(--cal-a-color) 10%,white),#fff);border-left:3px solid var(--cal-a-color);padding:12px 14px;border-radius:8px;margin-bottom:8px;animation:slideIn .4s ease;transition:.2s;cursor:pointer;position:relative;}
.cal-a-event-item::after{content:'点击查看详情 ›';position:absolute;right:10px;bottom:8px;font-size:10px;color:color-mix(in srgb,var(--cal-a-color) 65%,#94a3b8);opacity:0;transition:opacity .2s;}
.cal-a-event-item:hover{transform:translateX(3px);box-shadow:0 4px 12px color-mix(in srgb,var(--cal-a-color) 15%,transparent);}
.cal-a-event-item:hover::after{opacity:.9;}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
.cal-a-event-item .ev-title{font-size:15px;font-weight:600;color:#1e293b;margin-bottom:5px;display:flex;align-items:center;gap:8px;padding-right:70px;flex-wrap:wrap;}
.cal-a-event-item .ev-title .time-tag{font-size:11px;font-weight:500;background:var(--cal-a-color);color:#fff;padding:2px 7px;border-radius:6px;}
.cal-a-event-item .ev-title .multi-tag{font-size:10px;font-weight:600;background:rgba(225,29,72,.15);color:#e11d48;padding:2px 6px;border-radius:6px;}
.cal-a-event-item .ev-meta{font-size:12px;color:#64748b;display:flex;gap:12px;flex-wrap:wrap;}
.no-events{font-size:13px;color:#cbd5e1;text-align:center;padding:50px 20px;}
.no-events .big{font-size:40px;margin-bottom:8px;opacity:.6;}

/* 日历B */
.calendar-b{border-radius:var(--card-radius);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1);display:grid;grid-template-columns:1fr 1fr;min-height:620px;transition:background .8s ease,border-radius .3s ease;background:#fff;}
.cal-b-piccol{display:flex;flex-direction:column;overflow:hidden;background:#0f172a;min-width:0;transition:background .8s ease;}
.cal-b-wdstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 8px;background:rgba(0,0,0,.28);}
.cal-b-wdstrip .wd-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px 5px;border-radius:9px;cursor:pointer;background:rgba(255,255,255,.11);color:#fff;border:2px solid transparent;transition:all .35s cubic-bezier(.4,0,.2,1);min-width:0;font-family:inherit;}
.cal-b-wdstrip .wd-btn:hover{background:rgba(255,255,255,.24);transform:translateY(-2px);}
.cal-b-wdstrip .wd-btn.active{background:#fff;color:var(--theme-color,#e11d48);transform:scale(1.06);box-shadow:0 4px 14px rgba(0,0,0,.35);}
.cal-b-wdstrip .wd-btn .wn{font-size:10px;letter-spacing:1px;opacity:.85;white-space:nowrap;}
.cal-b-wdstrip .wd-btn .dn{font-size:16px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.cal-b-wdstrip .wd-btn .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0;}
.cal-b-wdstrip .wd-btn.today .dot{opacity:.95;}
.cal-b-picwrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;transition:background .8s ease;}
.cal-b-picbox{position:relative;aspect-ratio:9/16;height:100%;max-width:100%;border-radius:14px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.45);background:rgba(0,0,0,.2);}
.cal-b-pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .7s ease,transform .7s ease;}
.cal-b-pic.swap{opacity:0;transform:scale(1.08);}
.cal-b-detailcol{display:flex;flex-direction:column;overflow:hidden;background:#fff;min-width:0;transition:background .6s ease;}
.cal-b-dhead{padding:16px 18px 13px;border-bottom:1px solid #eef2f7;transition:border-color .6s ease;}
.cal-b-dtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.cal-b-dtitle{font-size:15px;font-weight:700;color:#1e293b;display:flex;align-items:center;gap:8px;}
.cal-b-dtitle .tag{font-size:11px;background:var(--theme-bg,#fff1f2);color:var(--theme-color,#e11d48);padding:3px 9px;border-radius:10px;font-weight:600;transition:all .5s;}
.cal-b-dcount{font-size:11px;background:var(--theme-bg,#fff1f2);color:var(--theme-color,#e11d48);padding:3px 10px;border-radius:10px;font-weight:700;transition:all .5s;}
.cal-b-dbig{display:flex;align-items:baseline;gap:10px;}
.cal-b-dbig .num{font-size:42px;font-weight:800;line-height:1;color:var(--theme-color,#e11d48);transition:color .5s;font-variant-numeric:tabular-nums;}
.cal-b-dbig .txt{font-size:13px;color:#64748b;line-height:1.6;}
.cal-b-dbig .txt .wk{font-weight:700;color:#334155;}
.cal-b-dlist{flex:1;overflow-y:auto;padding:12px 14px;}
.cal-b-event-card{padding:10px 12px;border-radius:10px;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--theme-color,#e11d48);background:var(--theme-bg,#fff1f2);animation:popIn .5s cubic-bezier(.34,1.56,.64,1);transition:background .5s ease,border-color .5s ease,transform .2s;cursor:pointer;position:relative;}
.cal-b-event-card:hover{transform:translateX(3px);}
.cal-b-event-card:hover::after{opacity:.85;}
.cal-b-event-card::after{content:'详情 ›';position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--theme-color,#e11d48);opacity:0;transition:opacity .2s;font-weight:600;}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.cal-b-event-card .ev-time{font-size:12px;font-weight:700;color:var(--theme-color,#e11d48);min-width:52px;transition:color .5s;}
.cal-b-event-card .ev-body{flex:1;min-width:0;padding-right:36px;}
.cal-b-event-card .ev-body .ev-t{font-size:13px;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.cal-b-event-card .ev-body .ev-t .multi-tag{font-size:9px;font-weight:700;background:rgba(225,29,72,.2);color:var(--theme-color,#e11d48);padding:1px 5px;border-radius:4px;flex-shrink:0;}
.cal-b-event-card .ev-body .ev-m{font-size:11px;color:#64748b;margin-top:2px;}

/* ============ 详情弹窗 ============ */
.detail-modal-mask{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;}
.detail-modal-mask.show{display:flex;animation:dmFadeIn .22s ease;}
@keyframes dmFadeIn{from{opacity:0}to{opacity:1}}
.detail-modal{background:#fff;border-radius:var(--card-radius);width:100%;max-width:480px;max-height:88vh;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35);animation:dmPopIn .32s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;position:relative;}
@keyframes dmPopIn{from{opacity:0;transform:translateY(24px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.detail-modal .dm-header{padding:22px 22px 16px;display:flex;align-items:flex-start;gap:12px;position:relative;border-bottom:1px solid #f0f2f6;}
.detail-modal .dm-cal-tag{flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18);}
.detail-modal .dm-title-wrap{flex:1;min-width:0;padding-right:36px;}
.detail-modal .dm-cal-name{font-size:11px;font-weight:600;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;opacity:.7;}
.detail-modal .dm-title{font-size:20px;font-weight:800;color:#1e293b;line-height:1.35;word-break:break-word;}
.detail-modal .dm-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:#f1f5f9;color:#64748b;font-size:20px;line-height:1;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;}
.detail-modal .dm-close:hover{background:#e2e8f0;color:#1e293b;transform:rotate(90deg);}
.detail-modal .dm-body{padding:6px 22px 22px;overflow-y:auto;}
.detail-modal .dm-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed #eef2f6;}
.detail-modal .dm-row:last-child{border-bottom:none;}
.detail-modal .dm-label{flex-shrink:0;width:56px;font-size:13px;color:#94a3b8;font-weight:500;padding-top:1px;}
.detail-modal .dm-value{flex:1;font-size:14px;color:#1e293b;line-height:1.65;word-break:break-word;font-weight:500;}
.detail-modal .dm-value.dm-muted{color:#94a3b8;font-weight:400;}
.detail-modal .dm-desc{white-space:pre-wrap;}
.detail-modal .dm-time-chip{background:color-mix(in srgb,var(--dm-color,#3b82f6) 12%,white);color:var(--dm-color,#3b82f6);font-weight:700;font-size:13px;padding:3px 10px;border-radius:8px;font-variant-numeric:tabular-nums;}
.detail-modal .dm-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569;}
.detail-modal .dm-badge.remind{background:#fef3c7;color:#b45309;}
.detail-modal .dm-badge.multi{background:color-mix(in srgb,var(--dm-color,#3b82f6) 12%,white);color:var(--dm-color,#3b82f6);}

function rowToEvent(row){

    id:row.id, calendarId:row.calendar_id||'A', title:row.title||'',
    date:row.date||'', endDate:row.end_date||'',
    startTime:row.start_time||'', endTime:row.end_time||'', allDay:!!row.all_day,
    location:row.location||'', repeat:row.repeat_rule||'none',
    remindBefore:row.remind_before!=null?String(row.remind_before):'0',
    description:row.description||'', color:row.color||(row.calendar_id==='B'?'#e11d48':'#3b82f6'),
    createdAt:row.created_at?new Date(row.created_at).getTime():Date.now(),
  };
}
function readLocalEvents(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch(e){return [];}}
function writeLocalEvents(list){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(list));}catch(e){}}

async function fetchEvents(){
  if(!_cloudEnabled){_eventsCache=readLocalEvents();return _eventsCache;}
  const {data,error}=await sb.from(CLOUD_EVENTS_TABLE).select('*');
  if(error){console.warn('云端读取日程失败：',error.message);_eventsCache=readLocalEvents();return _eventsCache;}
  _eventsCache=(data||[]).map(rowToEvent);

}
async function fetchSettings(){
  if(!_cloudEnabled){
    try{_termCache=JSON.parse(localStorage.getItem(TERM_KEY))||null;}catch(e){_termCache=null;}
    try{_themeCache=JSON.parse(localStorage.getItem(DISPLAY_THEME_KEY))||null;}catch(e){_themeCache=null;}
    try{_p404Cache=JSON.parse(localStorage.getItem(P404_KEY))||null;}catch(e){_p404Cache=null;}

  const {data,error}=await sb.from(CLOUD_SETTINGS_TABLE).select('*');

    try{_termCache=JSON.parse(localStorage.getItem(TERM_KEY))||null;}catch(e){_termCache=null;}

    try{_p404Cache=JSON.parse(localStorage.getItem(P404_KEY))||null;}catch(e){_p404Cache=null;}

  _termCache=null;_themeCache=null;_p404Cache=null;
  (data||[]).forEach(row=>{

    else if(row.key==='display_theme')_themeCache=row.value;
    else if(row.key==='page_404')_p404Cache=row.value;
  });
  if(_termCache)try{localStorage.setItem(TERM_KEY,JSON.stringify(_termCache));}catch(e){}
  if(_themeCache)try{localStorage.setItem(DISPLAY_THEME_KEY,JSON.stringify(_themeCache));}catch(e){}
  if(_p404Cache)try{localStorage.setItem(P404_KEY,JSON.stringify(_p404Cache));}catch(e){}
}
function loadEvents(){return _eventsCache.slice();}

/* ============ 展示页美化 ============ */
const DISPLAY_DEFAULTS={
  siteTitle:'日历展示中心',
  topbarBg:'linear-gradient(90deg,#0f2027,#203a43,#2c5364)',

};
function loadDisplayTheme(){

/* ============ 入场加载动画渲染 ============ */
function renderLoader(){

  else if(style==='wave')html+=`<div class="loader-wave">${Array.from(text).map(c=>`<span>${escapeHtml(c)}</span>`).join('')}</div>`;

/* ============ 重复规则 + 跨天支持 ============ */
function getDurationDays(ev){
  if(!ev.endDate||ev.endDate<=ev.date)return 0;
  const s=new Date(ev.date+'T00:00:00');
  const e=new Date(ev.endDate+'T00:00:00');
  if(isNaN(s.getTime())||isNaN(e.getTime()))return 0;
  return Math.max(0,Math.round((e-s)/86400000));
}

// 判断 dateStr 是否是某次发生的「起始日」
function isStartDate(ev,dateStr){
  const base=ev.date;
  const r=ev.repeat;
  if(!base)return false;
  if(!r||r==='none')return base===dateStr;
  if(dateStr<base)return false;
  const start=new Date(base+'T00:00:00');
  const cur=new Date(dateStr+'T00:00:00');
  if(isNaN(start.getTime())||isNaN(cur.getTime()))return base===dateStr;
  const diffDays=Math.round((cur-start)/86400000);
  if(diffDays<0)return false;
  if(r==='daily')return true;
  if(r==='workday'){const w=cur.getDay();return w>=1&&w<=5;}
  if(r==='weekly')return diffDays%7===0;
  if(r==='monthly')return cur.getDate()===start.getDate();
  if(r==='yearly')return cur.getDate()===start.getDate()&&cur.getMonth()===start.getMonth();
  if(r.indexOf('custom:')===0){
    let o=null;
    try{o=JSON.parse(r.slice(7));}catch(e){return base===dateStr;}
    const interval=Math.max(1,parseInt(o.interval,10)||1);
    const unit=o.unit||'week';
    let idx=-1;
    if(unit==='day'){
      if(diffDays%interval!==0)return false;
      idx=diffDays/interval;
    }else if(unit==='week'){
      const step=interval*7;
      if(diffDays%step!==0)return false;
      idx=diffDays/step;
    }else if(unit==='month'){
      const md=(cur.getFullYear()-start.getFullYear())*12+(cur.getMonth()-start.getMonth());
      if(md<0||md%interval!==0||cur.getDate()!==start.getDate())return false;
      idx=md/interval;
    }else if(unit==='year'){
      const yd=cur.getFullYear()-start.getFullYear();
      if(yd<0||yd%interval!==0||cur.getMonth()!==start.getMonth()||cur.getDate()!==start.getDate())return false;
      idx=yd/interval;
    }else{return base===dateStr;}
    if(o.endType==='count'){const n=parseInt(o.count,10)||1;return (idx+1)<=n;}
    if(o.endType==='until'){return o.until?dateStr<=o.until:true;}
    return true;
  }
  return base===dateStr;
}

// 判断 dateStr 是否在跨天区间内（含起始日）
function matchRepeat(ev,dateStr){
  const dur=getDurationDays(ev);
  if(dur===0)return isStartDate(ev,dateStr);
  // 往前推 0~dur 天，看是否有一次发生落在区间内
  const base=new Date(dateStr+'T00:00:00');
  if(isNaN(base.getTime()))return false;
  for(let d=0;d<=dur;d++){
    const check=new Date(base);
    check.setDate(check.getDate()-d);
    if(isStartDate(ev,formatDate(check)))return true;
  }
  return false;
}

function getEventsOf(dateStr,calId){
  return loadEvents().filter(e=>matchRepeat(e,dateStr)&&(!calId||e.calendarId===calId));
}

/* ============ 时钟 ============ */
const weekCN=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function tickClock(){
  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  const h=String(now.getHours()).padStart(2,'0');
  const mi=String(now.getMinutes()).padStart(2,'0');
  const s=String(now.getSeconds()).padStart(2,'0');
  document.getElementById('timeStr').textContent=`${h}:${mi}:${s}`;
  document.getElementById('dateStr').textContent=`${y}年${m}月${d}日`;
  document.getElementById('weekStr').textContent=weekCN[now.getDay()];
  updateTermBadge();
}
setInterval(tickClock,1000);tickClock();

/* ============ 教学周 ============ */
function ymdIndex(y,m,d){return Math.round(new Date(y,m-1,d).getTime()/86400000);}
function parseYMDText(s){
  const m=String(s||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?{y:+m[1],m:+m[2],d:+m[3]}:null;
}
function getTeachingWeek(){
  const t=loadTerm();
  if(!t||!t.startDate)return null;
  const sd=parseYMDText(t.startDate);
  if(!sd)return null;
  const now=new Date();
  const diff=ymdIndex(now.getFullYear(),now.getMonth()+1,now.getDate())-ymdIndex(sd.y,sd.m,sd.d);
  const week=Math.floor(diff/7)+1;
  let total=0;
  const ed=t.endDate?parseYMDText(t.endDate):null;
  if(ed)total=Math.floor((ymdIndex(ed.y,ed.m,ed.d)-ymdIndex(sd.y,sd.m,sd.d))/7)+1;
  let state='in';
  if(week<1)state='before';
  else if(total&&week>total)state='after';
  return {week:week,total:total,state:state};
}

let bigCurMonth=new Date();bigCurMonth.setDate(1);

/* ============ 大日历渲染 ============ */
function renderBigCalendar(){
  const year=bigCurMonth.getFullYear(),month=bigCurMonth.getMonth();
  document.getElementById('bigCalMonth').textContent=`${year} 年 ${month+1} 月`;
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const prevMonthDays=new Date(year,month,0).getDate();
  const today=new Date();
  const allEvs=loadEvents();
  const cntOf=ds=>{
    let a=0,b=0;
    for(let i=0;i<allEvs.length;i++){
      const e=allEvs[i];
      if(!matchRepeat(e,ds))continue;
      if(e.calendarId==='A')a++;else b++;
    }
    return {a:a,b:b};
  };
  const selStr=formatDate(selectedDate);
  const daysEl=document.getElementById('bigDays');
  daysEl.innerHTML='';
  for(let i=firstDay-1;i>=0;i--){
    const d=prevMonthDays-i;
    const pm=new Date(year,month-1,d);
    const ds=formatDate(pm);
    const cnt=cntOf(ds);
    daysEl.innerHTML+=`<div class="day other-month" data-date="${ds}" onclick="selectDate('${ds}')">
      <span class="dnum">${d}</span>
      ${(cnt.a||cnt.b)?`<div class="dbar">${cnt.a?'<div class="b-a"></div>':'<div class="b-none"></div>'}${cnt.b?'<div class="b-b"></div>':'<div class="b-none"></div>'}</div>`:''}
    </div>`;
  }
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d;
    const isSel=ds===selStr;
    const cnt=cntOf(ds);
    const wk=new Date(year,month,d).getDay();
    const wkN=['日','一','二','三','四','五','六'][wk];
    let badges='';
    if(cnt.a)badges+=`<span class="cnt-a">${cnt.a}</span>`;
    if(cnt.b)badges+=`<span class="cnt-b">${cnt.b}</span>`;
    let bar='';
    if(cnt.a||cnt.b)bar=`<div class="dbar">${cnt.a?'<div class="b-a"></div>':'<div class="b-none"></div>'}${cnt.b?'<div class="b-b"></div>':'<div class="b-none"></div>'}</div>`;
    daysEl.innerHTML+=`<div class="day ${isToday?'today':''} ${isSel?'selected':''}" data-date="${ds}" onclick="selectDate('${ds}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <span class="dnum">${d}</span>
        ${badges}
      </div>
      <span class="dwk">${wkN}</span>
      ${bar}
    </div>`;
  }
  const totalCells=firstDay+daysInMonth;
  const trailing=(7-totalCells%7)%7;
  for(let i=1;i<=trailing;i++){
    const nm=new Date(year,month+1,i);
    const ds=formatDate(nm);
    const cnt=cntOf(ds);
    daysEl.innerHTML+=`<div class="day other-month" data-date="${ds}" onclick="selectDate('${ds}')">
      <span class="dnum">${i}</span>
      ${(cnt.a||cnt.b)?`<div class="dbar">${cnt.a?'<div class="b-a"></div>':'<div class="b-none"></div>'}${cnt.b?'<div class="b-b"></div>':'<div class="b-none"></div>'}</div>`:''}
    </div>`;
  }
}
function changeBigMonth(delta){
  bigCurMonth.setMonth(bigCurMonth.getMonth()+delta);

}

function openEventDetail(id, dateStr){
  const ev=loadEvents().find(e=>e.id===id);
  if(!ev)return;

  const isA=ev.calendarId==='A';
  const accentColor=isA
    ?(getComputedStyle(document.documentElement).getPropertyValue('--cal-a-color').trim()||'#3b82f6')
    :(ev.color||getComputedStyle(document.documentElement).getPropertyValue('--cal-b-color').trim()||'#e11d48');

  const modal=document.getElementById('detailModal');
  modal.style.setProperty('--dm-color',accentColor);

  const calTag=document.getElementById('dmCalTag');
  calTag.textContent=isA?'A':'B';
  calTag.style.background=accentColor;

  document.getElementById('dmCalName').textContent=isA?'日历A · 商务日程':'日历B · 主题日历';
  document.getElementById('dmTitle').textContent=ev.title||'未命名日程';

  // 日期
  const showDate=dateStr||ev.date||'';
  let dateTxt='—';
  if(showDate){
    const d=new Date(showDate+'T00:00:00');
    if(!isNaN(d.getTime())){
      const wd=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
      dateTxt=`${showDate}（${wd}）`;
    }else{dateTxt=showDate;}
  }
  document.getElementById('dmDate').textContent=dateTxt;

  // 跨天信息
  const dur=getDurationDays(ev);
  const durRow=document.getElementById('dmDurationRow');
  const durEl=document.getElementById('dmDuration');
  if(dur>0){
    const endD=new Date(ev.endDate+'T00:00:00');
    const endWk=!isNaN(endD.getTime())?['周日','周一','周二','周三','周四','周五','周六'][endD.getDay()]:'';
    durEl.innerHTML=`<span class="dm-badge multi">📅 ${ev.endDate}${endWk?'（'+endWk+'）':''}　共 ${dur+1} 天</span>`;
    durRow.style.display='';
  }else{
    durRow.style.display='none';
  }

  // 时间
  const timeEl=document.getElementById('dmTime');
  if(ev.allDay||!ev.startTime){
    timeEl.innerHTML=`<span class="dm-badge">全天</span>`;
  }else{
    const end=ev.endTime?` - ${ev.endTime}`:'';
    timeEl.innerHTML=`<span class="dm-time-chip">${ev.startTime}${end}</span>`;
  }

  // 地点
  const locRow=document.getElementById('dmLocRow');
  const locEl=document.getElementById('dmLoc');
  if(ev.location){locEl.textContent=ev.location;locEl.classList.remove('dm-muted');locRow.style.display='';}
  else{locEl.textContent='未填写';locEl.classList.add('dm-muted');}

  document.getElementById('dmRepeat').textContent=repeatLabel(ev.repeat);

  // 提醒
  const remindRow=document.getElementById('dmRemindRow');
  const remindEl=document.getElementById('dmRemind');
  if(ev.remindBefore&&ev.remindBefore!=='0'){
    remindEl.innerHTML=`<span class="dm-badge remind">🔔 ${remindLabel(ev.remindBefore)}</span>`;
    remindRow.style.display='';
  }else{
    remindEl.textContent='不提醒';
    remindEl.classList.add('dm-muted');
  }

  // 备注
  const descRow=document.getElementById('dmDescRow');
  const descEl=document.getElementById('dmDesc');
  if(ev.description){descEl.textContent=ev.description;descEl.classList.remove('dm-muted');descRow.style.display='';}
  else{descEl.textContent='无';descEl.classList.add('dm-muted');}

  document.getElementById('detailModalMask').classList.add('show');
  document.body.style.overflow='hidden';
}

  document.body.style.overflow='';

/* ============ 插图容器 9:16 ============ */
function fitPosterBox(){
  const wrap=document.getElementById('calBPicWrap');
  const box=document.getElementById('calBPicBox');
  if(!wrap||!box)return;
  const cs=getComputedStyle(wrap);
  const availW=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const availH=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(availW<=0||availH<=0)return;
  let w=availW,h=w*16/9;
  if(h>availH){h=availH;w=h*9/16;}
  box.style.width=Math.floor(w)+'px';
  box.style.height=Math.floor(h)+'px';
}

/* ============ 工具 ============ */
function formatDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function repeatLabel(r){
  if(r&&r.startsWith('custom:')){
    try{const obj=JSON.parse(r.slice(7));return `自定义·每${obj.interval}${obj.unit==='day'?'天':obj.unit==='week'?'周':obj.unit==='month'?'月':'年'}`;}catch(e){return'自定义';}
  }
  return {none:'不重复',daily:'每天',weekly:'每周',monthly:'每月',yearly:'每年',workday:'工作日'}[r]||r;
}
function remindLabel(m){const n=Number(m);if(n===0)return'不提醒';if(n<60)return n+'分钟前';if(n===60)return'1小时前';if(n===1440)return'1天前';return Math.round(n/60)+'小时前';}
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)+pct;let g=((n>>8)&0xff)+pct;let b=(n&0xff)+pct;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

  const themes=getThemes();
  const demo=[
    {id:genId(),calendarId:'A',title:'团队早会',date:today,startTime:'09:00',endTime:'09:30',location:'会议室A',description:'本周工作同步',remindBefore:'15',repeat:'workday',color:'#3b82f6',createdAt:Date.now()},
    {id:genId(),calendarId:'A',title:'项目评审会议',date:today,startTime:'14:00',endTime:'16:00',location:'大会议室',description:'Q4需求评审',remindBefore:'30',repeat:'none',color:'#3b82f6',createdAt:Date.now()},
    {id:genId(),calendarId:'B',title:'晨跑锻炼',date:today,startTime:'07:00',endTime:'07:45',location:'城市公园',description:'每周固定锻炼',remindBefore:'10',repeat:'weekly',color:themes[t.getDay()].color,createdAt:Date.now()},
    {id:genId(),calendarId:'B',title:'下午茶时光',date:tomorrow,startTime:'15:30',endTime:'16:00',location:'咖啡厅',description:'放松一下',remindBefore:'0',repeat:'none',color:'#f59e0b',createdAt:Date.now()},
  ];
  if(_cloudEnabled){
    try{
      const rows=demo.map(e=>({
        id:e.id,calendar_id:e.calendarId,title:e.title,date:e.date,end_date:e.endDate||'',
        start_time:e.startTime,end_time:e.endTime,all_day:!!e.allDay,
        location:e.location,repeat_rule:e.repeat,remind_before:e.remindBefore,
        description:e.description,color:e.color,created_at:new Date(e.createdAt).toISOString()
      }));
      await sb.from(CLOUD_EVENTS_TABLE).insert(rows);
      await fetchEvents();
    }catch(e){console.warn('写入演示数据失败：',e);}
  }else{
    writeLocalEvents(demo);_eventsCache=demo;
  }
}

async function pullAll(){await fetchEvents();await fetchSettings();}

window.addEventListener('load',async()=>{
  initCloud();
  updateSyncTip();
  renderLoader();
  try{await pullAll();}catch(e){console.warn('云端读取失败：',e);}
  applyDisplayTheme();
  applyPage404();
  await seedDemoIfEmpty();
  refreshAll();
  fitPosterBox();

  const cfg=loadDisplayTheme();
  const ms=cfg.loaderStyle==='none'?0:(cfg.loaderMs!=null?cfg.loaderMs:1400);
  if(ms<=0){hideLoader();fitPosterBox();}
  else{setTimeout(()=>{hideLoader();fitPosterBox();},ms);}

  setInterval(async()=>{
    if(document.visibilityState!=='visible')return;
    try{
      await pullAll();
      renderLoader();
      applyDisplayTheme();
      applyPage404();
      refreshAll();
    }catch(e){}
  },30000);
});
window.addEventListener('resize',()=>{fitPosterBox();});
if(window.ResizeObserver){
  const pw=document.getElementById('calBPicWrap');
  if(pw)new ResizeObserver(()=>fitPosterBox()).observe(pw);
}
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'){
    try{
      await pullAll();
      renderLoader();
      applyDisplayTheme();
      applyPage404();
      refreshAll();
    }catch(e){}
  }
});
</script>
</body>
</html>
