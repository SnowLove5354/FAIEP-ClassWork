name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Print access links
        run: |
          echo "==========================================="
          echo "✅ 部署成功！访问链接："
          echo ""
          echo "📱 日历展示平台（公开访问）:"
          echo "   ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "⚙ 日历管理平台（仅管理员访问）:"
          echo "   ${{ steps.deployment.outputs.page_url }}admin.html"
          echo "==========================================="
